[project]
name = "agent-upgrade-demo"
version = "0.1.0"
description = "Side-by-side demo: a slow LLM agent and an upgraded one, measured with a benchmark and judge. Example domain."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*create_react_agent.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "portfolio_api", "agent_common", "agent_v1", "agent_v2", "server", "client", "bench", "gateway", "deploy"]

[tool.setuptools.package-data]
bench = ["scenarios.yaml"]
